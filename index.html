<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Interactive simulation of a combi boiler heating one to three rooms: flow temperature, TRVs, lockshields, thermostat, insulation and outside temperature."
    />
    <link rel="stylesheet" href="/style.css" />
    <title>Combi Heating Simulator</title>
  </head>

  <body>
    <header class="topbar">
      <h1>
        <span class="title-badge" aria-hidden="true">
          <svg width="20" height="22" viewBox="0 0 20 22"><path fill="#ffffff" d="M10 1c1.2 4 7 6.2 7 12a7 7 0 0 1-14 0c0-3.4 1.8-5.6 3.3-7 .2 2.3 1.2 3.6 2.6 3.9C8.6 7.2 8 4.4 10 1z"/></svg>
        </span>
        Combi Heating Simulator
      </h1>
      <div class="simbar" aria-label="Simulation controls">
        <div class="rooms-picker">
          <span class="rooms-label" id="rooms-label">Rooms</span>
          <div class="seg" id="rooms" role="radiogroup" aria-labelledby="rooms-label"></div>
        </div>
        <span id="clock" class="clock" hidden aria-live="off">06:00</span><!-- shown while the day/night cycle is on -->
        <div class="seg" id="speed" role="radiogroup" aria-label="Simulation speed"></div>
        <button id="btn-reset" class="btn" type="button" title="Restart from cold: rooms, water and pipes all at the outside temperature">Reset</button>
        <div class="view-toggles" aria-label="View options">
          <button id="i-losses" class="btn toggle" type="button" aria-pressed="false" title="Show where heat escapes: walls, roof and draughts">Heat loss</button>
          <button id="i-details" class="btn toggle" type="button" aria-pressed="false" title="Show more detail in the tooltips">Details</button>
        </div>
      </div>
    </header>

    <!-- The drawing fills the rest of the window, like a game screen. -->
    <main class="stage">
      <div id="scene" class="scene"></div>
      <p class="scene-hint">Click the boiler, thermostat, TRVs, lockshields, walls or outside to change them.</p>

    </main>

    <!-- History chart and table: hidden for now. -->
    <details class="card history" id="history" hidden>
      <summary>History (last 6 hours)</summary>
      <ul class="chart-legend" id="chart-legend"></ul>
      <div id="chart" class="chart"></div>
      <details id="table-details" class="table-details">
        <summary>Show as table</summary>
        <div class="table-wrap"><table id="data-table"></table></div>
      </details>
    </details>

    <!-- The bubble beside an object in the scene: its details on hover, plus
         its controls once clicked. Filled in by deviceCard.ts. -->
    <div id="device-card" class="device-card" role="tooltip" aria-labelledby="card-title" tabindex="-1" hidden>
      <div class="card-head">
        <h2 id="card-title" class="card-title"></h2>
        <button class="card-close" type="button" aria-label="Close">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="card-info"></div>
      <div class="card-body" hidden></div>
      <span class="card-arrow" aria-hidden="true"></span>
    </div>

    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
