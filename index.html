<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Interactive simulation of a combi boiler heating one to three rooms: flow temperature, TRVs, lockshields, thermostat, insulation and outside temperature."
    />
    <link rel="stylesheet" href="/style.css" />
    <title>Combi Heating Simulator</title>
  </head>

  <body>
    <header class="topbar">
      <h1>
        <span class="title-badge" aria-hidden="true">
          <svg width="20" height="22" viewBox="0 0 20 22"><path fill="#ffffff" d="M10 1c1.2 4 7 6.2 7 12a7 7 0 0 1-14 0c0-3.4 1.8-5.6 3.3-7 .2 2.3 1.2 3.6 2.6 3.9C8.6 7.2 8 4.4 10 1z"/></svg>
        </span>
        Combi Heating Simulator
      </h1>
      <div class="simbar" aria-label="Simulation controls">
        <div class="rooms-picker">
          <span class="rooms-label" id="rooms-label">Rooms</span>
          <div class="seg" id="rooms" role="radiogroup" aria-labelledby="rooms-label"></div>
        </div>
        <span id="clock" class="clock" hidden>Day 1 · 06:00</span><!-- hidden for now -->
        <div class="seg" id="speed" role="radiogroup" aria-label="Simulation speed"></div>
        <button id="btn-reset" class="btn" type="button" title="Restart from cold: rooms, water and pipes all at the outside temperature">Reset</button>
      </div>
    </header>

    <main class="page">
      <div class="card scene-card">
        <div id="scene" class="scene"></div>

        <div class="status-row">
          <span class="water-legend" aria-label="Water colour scale from 10 to 80 degrees">
            <span>10°</span><span id="water-scale" class="water-scale"></span><span>80°</span>
          </span>
        </div>

        <details class="controls-group" id="controls-group">
          <summary>Controls</summary>
          <div class="controls">
            <div class="ctl ctl-power">
              <span class="ctl-label" id="power-label">Boiler <output id="o-power">On</output></span>
              <button id="i-power" class="switch" type="button" role="switch" aria-checked="true" aria-labelledby="power-label">
                <span class="knob"></span>
              </button>
            </div>
            <div class="ctl ctl-flow">
              <label class="ctl-label" for="i-flow">Flow temp <output id="o-flow">65 °C</output></label>
              <input id="i-flow" type="range" min="30" max="80" step="1" value="65" />
            </div>
            <div class="ctl ctl-stat">
              <label class="ctl-label" for="i-stat">Thermostat <output id="o-stat">20.0 °C</output></label>
              <input id="i-stat" type="range" min="5" max="30" step="0.5" value="20" />
            </div>
            <div class="ctl ctl-ins">
              <span class="ctl-label" id="ins-label">Insulation</span>
              <div class="seg" id="insulation" role="radiogroup" aria-labelledby="ins-label"></div>
            </div>
            <div class="ctl ctl-out">
              <label class="ctl-label" for="i-out">Outside <output id="o-out">5 °C</output></label>
              <input id="i-out" type="range" min="-15" max="25" step="1" value="5" />
            </div>
          </div>
          <!-- One row per radiator, from the template below. -->
          <div class="radiators" id="radiators"></div>
          <template id="radiator-row">
            <div class="rad-row">
              <span class="rad-name"></span>
              <div class="ctl ctl-trv">
                <span class="ctl-label"><span class="trv-label">TRV</span> <output class="o-trv"></output></span>
                <div class="seg trv" role="radiogroup"></div>
              </div>
              <div class="ctl ctl-ls">
                <label class="ctl-label">Lockshield <output class="o-ls">100%</output></label>
                <input class="i-ls" type="range" min="10" max="100" step="10" value="100" />
              </div>
            </div>
          </template>
          <div class="view-options">
            <label class="view-toggle"><input id="i-losses" type="checkbox" /> Show heat loss</label>
            <label class="view-toggle"><input id="i-details" type="checkbox" /> Detailed tooltips</label>
          </div>
        </details>
      </div>

      <!-- History chart and table: hidden for now. -->
      <details class="card history" id="history" hidden>
        <summary>History (last 6 hours)</summary>
        <ul class="chart-legend" id="chart-legend"></ul>
        <div id="chart" class="chart"></div>
        <details id="table-details" class="table-details">
          <summary>Show as table</summary>
          <div class="table-wrap"><table id="data-table"></table></div>
        </details>
      </details>
    </main>

    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
